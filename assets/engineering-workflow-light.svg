<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Physical and digital systems workflows</title><desc id="desc">Physical: Inspect, Diagnose, Plan, Execute, Verify, Improve. Digital: Problem, Model, Architect, Build, Validate, Iterate.</desc><rect width="960" height="360" rx="16" fill="#ffffff"/><text x="30" y="34" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700">Physical systems</text><rect x="30" y="58" width="132" height="64" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="96" y="96" text-anchor="middle" fill="#172033" font-family="Arial,sans-serif" font-size="15" font-weight="600">Inspect</text><path d="M 164 90 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="184" y="58" width="132" height="64" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="250" y="96" text-anchor="middle" fill="#172033" font-family="Arial,sans-serif" font-size="15" font-weight="600">Diagnose</text><path d="M 318 90 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="338" y="58" width="132" height="64" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="404" y="96" text-anchor="middle" fill="#172033" font-family="Arial,sans-serif" font-size="15" font-weight="600">Plan</text><path d="M 472 90 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="58" width="132" height="64" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="558" y="96" text-anchor="middle" fill="#172033" font-family="Arial,sans-serif" font-size="15" font-weight="600">Execute</text><path d="M 626 90 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-l